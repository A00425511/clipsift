# ClipSift default configuration. Every number here is a tunable value, not a claim.
# Protocol numbers come from a DRAFT protocol with unresolved comments; keep them configurable.

layer: 1                 # 0 = manual assist, 1 = local model, 2 = stubs (2a) ; see README
sample_fps: 2.0          # sampling rate of the full-window motion scan
proxy_width: 320         # width used ONLY for the fast motion scan. Faint movement can vanish at low resolution.
detect_width: 640        # width of frames given to detectors (0 = original). Boxes are scaled back to original pixels.

recording:
  site: null
  date: null
  video_id: null         # set to match the Coastal Action spreadsheet if the filename guess is wrong

# Which backend runs each stage. Names are registered in clipsift/stages.
stages:
  proposer: median_background
  detector: motion_blob  # development stand-in. Use onnx once a model path is set.
  tracker: iou
  classifier: placeholder
  counter: basic
  counting_model: null   # optional point/density counter for schools (stub only)

# Coastal Action protocol (draft). All values in seconds unless noted.
protocol:
  trim_start_s: 60
  trim_end_s: 60
  extra_trim_max_s: 240
  window_length_s: 900
  window_start_s: null   # optional per-recording override of the analysis window start
  window_end_s: null     # optional per-recording override of the analysis window end
  interval_s: 60         # one subsample point every interval_s (an older draft says 12 s)
  context_s: 5           # context shown either side of each point (a comment suggests 10)
  count_window_s: 1      # count only within this designated window
  count_tolerance_s: 0.5 # a fish appearing within this long either side may count
  context_sample_fps: 4.0
  qc_share: 0.10
  qc_min: 6
  qc_max: 12
  qc_max_percent_diff: 6
  qc_agreement: 95
  qc_seed: 4321

proposer:
  window_samples: 30     # samples per background window (median)
  diff_threshold: 9      # grey levels, after blur
  blur_ksize: 5
  min_blob_area: 16      # pixels at proxy_width
  min_consecutive: 2     # consecutive active samples needed
  merge_gap_s: 4.0       # active runs closer than this are merged
  pad_s: 1.0
  max_segment_s: 60
  max_set_aside_s: 60
  shake_px: 2.5          # global shift (proxy pixels) above which the shake flag is set
  contrast_scale: 60.0   # grey-level std that counts as full contrast
  sharpness_scale: 150.0 # Laplacian variance that counts as fully sharp
  low_visibility_below: 0.25

audit:
  share: 0.05            # share of set-aside time marked for audit review
  seed: 1234

detector:
  onnx:
    model_path: null     # REQUIRED for the onnx backend, for example models/fish.onnx
    input_size: 640
    conf: 0.25
    nms_iou: 0.45
    class_names: [fish]
    keep_class_ids: null # null keeps all classes
    has_objectness: false  # true for YOLOv5-style output
  motion_blob:
    diff_threshold: 14
    blur_ksize: 5
    min_area: 120         # pixels at detect_width
    max_area_frac: 0.25

# Tiled inference: split each frame into overlapping tiles so small midwater fish (about 30 px long)
# are not lost when the frame is shrunk to the model input. Off by default; slower.
tiling:
  enabled: false
  tile_size: 640
  overlap: 0.2
  nms_iou: 0.5

tracker:
  iou_threshold: 0.2
  max_gap_samples: 2
  min_points: 2

classifier:
  known_threshold: 0.6
  unclear_threshold: 0.3

counter:
  mean_count_interval_s: 1.0

loop:
  max_s: 20
  crf: 23
  max_width: 0           # 0 = keep original size

cloud:
  enable_2b: false       # Layer 2b is never on unless this is true, and it is still a stub

paths:
  runs_dir: runs
  models_dir: models
